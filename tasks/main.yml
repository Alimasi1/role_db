---
# tasks file for roles/role_db

---
- name: Installeer Python3 en PyMySQL library (nodig voor Ansible MySQL module)
  ansible.builtin.apt:
    name:
      - python3
      - python3-pymysql
    state: present
    update_cache: yes

- name: Installeer MariaDB
  ansible.builtin.apt:
    name: mariadb-server
    state: present
    update_cache: yes

- name: Zorg dat MariaDB service draait
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Maak database {{ db_name }}
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present

