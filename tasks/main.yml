---
- name: Installeer Python3 en PyMySQL library (nodig voor Ansible MySQL module)
  ansible.builtin.apt:
    name:
      - python3
      - python3-pymysql
    state: present
    update_cache: yes

- name: Installeer MariaDB
  ansible.builtin.apt:
    name: mariadb-server
    state: present
    update_cache: yes

- name: Zorg dat MariaDB service draait
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Maak database aan
  community.mysql.mysql_db:
    name: myapp
    state: present
    login_user: root
    login_password: ""                # <-- leeg laten!
    login_unix_socket: /run/mysqld/mysqld.sock
    check_implicit_admin: true        # <-- belangrijk voor unix_socket auth
  become: true
